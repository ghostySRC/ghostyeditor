name: Test GhostyLinux Cloud

on:
  push:
    branches:
      - ghostylinux-cloud-v2
    paths:
      - ".devcontainer/**"
      - ".github/workflows/ghostylinux-cloud-test.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build GhostyLinux Codespaces image
        run: docker build -f .devcontainer/Dockerfile -t ghostylinux-cloud:test .
