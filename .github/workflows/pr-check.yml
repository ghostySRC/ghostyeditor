name: PR Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  web-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck web editor
        run: npm run check --workspace=@diffusionstudio/web

      - name: Typecheck AI edge endpoint
        run: npx tsc --noEmit --target ES2024 --module ESNext --moduleResolution Bundler --lib ES2024,DOM --types node apps/web/api/ai/edit.ts
